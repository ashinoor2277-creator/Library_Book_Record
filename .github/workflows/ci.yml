name: Library Book Record CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          
      - name: Check HTML a nd JavaScript references
        run: |
          grep -q 'style.css' index.html
          grep -q 'script.js' index.html
          grep -q 'bookForm' script.js

      - name: Build check
        run: |
          echo "Library Book Record application passed basic build checks."